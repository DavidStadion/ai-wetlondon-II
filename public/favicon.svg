<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- The raindrop mascot from the header, as a tab icon. Solid background so
       it stays legible at 16px, where a transparent drop disappears.

       Pupils are slightly larger in proportion than the header's, because at
       16px a scale-accurate dot closes up into a smudge and he goes back to
       having blank eyes. Kept centred rather than glancing: the header mascot
       animates, a favicon cannot, and a permanent sideways look reads as a
       squint. -->
  <rect width="64" height="64" rx="14" fill="#0C0C0D"/>
  <path d="M32 10c0 0 15 18.5 15 28.5a15 15 0 0 1-30 0C17 28.5 32 10 32 10Z" fill="#fff"/>
  <ellipse cx="26.6" cy="39" rx="3.6" ry="4.4" fill="#0C0C0D"/>
  <ellipse cx="37.4" cy="39" rx="3.6" ry="4.4" fill="#0C0C0D"/>
  <circle cx="26.6" cy="39.5" r="1.9" fill="#fff"/>
  <circle cx="37.4" cy="39.5" r="1.9" fill="#fff"/>
</svg>
